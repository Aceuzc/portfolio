<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Ace Eufracio AE monogram</title>
  <desc id="logo-desc">A dark circular AE monogram with a purple accent ring.</desc>
  <defs>
    <linearGradient id="ring" x1="14" y1="10" x2="82" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a89cf9"/>
      <stop offset="0.54" stop-color="#7c6af7"/>
      <stop offset="1" stop-color="#52d6ff"/>
    </linearGradient>
    <radialGradient id="surface" cx="32" cy="20" r="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2540"/>
      <stop offset="0.52" stop-color="#0f1623"/>
      <stop offset="1" stop-color="#080c14"/>
    </radialGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.486 0 0 0 0 0.416 0 0 0 0 0.969 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="43" fill="url(#surface)"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="48" cy="48" r="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <path d="M24 69L72 27" fill="none" stroke="url(#ring)" stroke-width="2.4" stroke-linecap="round" opacity="0.46" filter="url(#soft-glow)"/>
  <path d="M25 64L39 31h7l14 33h-8l-2.8-7.3H36.8L34 64h-9Zm14.2-14.7h7.6L43 38.9l-3.8 10.4Z" fill="#f1f5f9"/>
  <path d="M57 32h22v7H65v5.7h12.4v6.8H65V57h15v7H57V32Z" fill="#a89cf9"/>
